name: Build ImmortalWrt HL7621S

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source files
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          # 基础依赖安装
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget coreutils

          # 【终极修复】强制建立标准 GNU install 的软链接（ginstall）以通过检查
          mkdir -p ~/bin
          cp $(which install) ~/bin/ginstall
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Clone ImmortalWrt 23.05
        run: |
          git clone -b openwrt-23.05 --single-branch https://github.com/immortalwrt/immortalwrt.git

      - name: Apply HL7621S DTS & Image config
        run: |
          # 1. 智能寻找并复制 DTS 文件
          DTS_FILE=$(find . -maxdepth 2 -name "*hl7621s.dts" | head -n 1)
          if [ -z "$DTS_FILE" ]; then
            echo "错误：在仓库中没有找到 .dts 文件，编译终止！"
            exit 1
          else
            echo "找到 DTS 文件: $DTS_FILE"
            mkdir -p immortalwrt/target/linux/ramips/files/arch/mips/boot/dts/
            cp -f "$DTS_FILE" immortalwrt/target/linux/ramips/files/arch/mips/boot/dts/mt7621_hl7621s.dts
          fi

          # 2. 安全追加 mk 设备规则，先清理旧定义防止重复报错
          MK_FILE=$(find . -maxdepth 2 -name "mt7621.mk" | head -n 1)
          if [ -z "$MK_FILE" ]; then
            echo "警告：没有找到 mt7621.mk 文件，跳过 mk 追加步骤。"
          else
            sed -i '/define Device\/hailin_hl7621s/,/^endef/d' immortalwrt/target/linux/ramips/image/mt7621.mk
            sed -i 's/[ \t]*hailin_hl7621s//g' immortalwrt/target/linux/ramips/image/mt7621.mk
            cat "$MK_FILE" >> immortalwrt/target/linux/ramips/image/mt7621.mk
          fi

      - name: Generate .config
        run: |
          cd immortalwrt
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621s=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) V=s

      - name: Collect firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HL7621S_Firmware
          path: |
            immortalwrt/bin/targets/ramips/mt7621/*hailin*factory.bin
            immortalwrt/bin/targets/ramips/mt7621/*hailin*sysupgrade.bin
