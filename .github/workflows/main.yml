name: ImmortalWrt 23.05 编译 HL7621S

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source files
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            coreutils \
            build-essential \
            asciidoc \
            binutils \
            bzip2 \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libz-dev \
            patch \
            python3 \
            python3-setuptools \
            unzip \
            zlib1g-dev \
            lib32gcc-s1 \
            libc6-dev-i386 \
            subversion \
            flex \
            uglifyjs \
            gcc-multilib \
            g++-multilib \
            p7zip \
            p7zip-full \
            msmtp \
            libssl-dev \
            texinfo \
            libglib2.0-dev \
            xmlto \
            qemu-utils \
            upx \
            libelf-dev \
            autoconf \
            automake \
            libtool \
            autopoint \
            device-tree-compiler \
            antlr3 \
            gperf \
            wget \
            curl \
            swig \
            rsync
          # 锁定 GNU install，前置导出
          echo "INSTALL=$(command -v install)" >> $GITHUB_ENV
          command -v install
          install --version

      - name: Clone ImmortalWrt 23.05
        run: |
          git clone --depth 1 -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply HL7621S DTS & Image config
        run: |
          cp src/mt7621_hailin_hl7621s.dts immortalwrt/target/linux/ramips/dts/
          cat src/mt7621.mk >> immortalwrt/target/linux/ramips/image/mt7621.mk

      - name: Generate .config (LuCI + 简体中文)
        run: |
          cd immortalwrt
          cat > .config << EOF
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621s=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-opkg=y
          CONFIG_PACKAGE_uhttpd=y

          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-status-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-system-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-network-zh-cn=y

          CONFIG_PACKAGE_zoneinfo-asia=y
          EOF
          # 关键：生成配置同时带 FORCE，强制通过 prereq
          make defconfig FORCE=1

      - name: Build firmware
        run: |
          cd immortalwrt
          export FORCE=1
          export IGNORE_ERRORS=1
          make -j$(nproc) V=s

      - name: Collect firmware artifacts
        run: |
          mkdir -p output
          cp -f immortalwrt/bin/targets/ramips/mt7621/*.bin output/
          cp -f immortalwrt/bin/targets/ramips/mt7621/*.manifest output/ 2>/dev/null || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-hl7621s-firmware
          path: output/*
          if-no-files-found: error
