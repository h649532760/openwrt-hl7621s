# .github/workflows/main.yml
name: Build ImmortalWrt HL7621S 23.05
run-name: HL7621S Build · 16M

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.config'
      - 'mt7621.mk'
      - 'mt7621_hailin_hl7621s.dts'
  workflow_dispatch:

env:
  BRANCH: openwrt-23.05
  IMAGE_NAME: immortalwrt-hl7621s-16m
  USE_MIRROR: "true"
  SRC_DIR: immortalwrt
  INSTALL: /usr/bin/install

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          node-version: 20

      - name: Install Build Dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            gcc \
            g++ \
            binutils \
            bzip2 \
            curl \
            git \
            wget \
            file \
            python3 \
            python3-pip \
            perl \
            unzip \
            rsync \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            quilt \
            patch \
            coreutils \
            time \
            gawk \
            gettext \
            swig \
            libxml2-dev \
            libxslt-dev \
            cmake \
            ninja-build \
            ccache
          sudo rm -rf /var/lib/apt/lists/*

      - name: Clone ImmortalWrt Source
        run: |
          set -e
          rm -rf ${{ env.SRC_DIR }}
          git clone --depth 1 --branch ${{ env.BRANCH }} https://github.com/ImmortalWrt/immortalwrt.git ${{ env.SRC_DIR }}
          cd ${{ env.SRC_DIR }}
          if [ "${{ env.USE_MIRROR }}" = "true" ]; then
            sed -i 's/https:\/\/github.com\//https:\/\/mirror.ghproxy.com\/https:\/\/github.com\//g' feeds.conf.default
          fi
          rm -rf ./feeds
          mkdir -p ./feeds

      - name: Inject Custom Files
        run: |
          set -e
          cd ${{ env.SRC_DIR }}
          cp -f ${{ github.workspace }}/mt7621.mk target/linux/ramips/image/mt7621.mk
          cp -f ${{ github.workspace }}/mt7621_hailin_hl7621s.dts target/linux/ramips/dts/mt7621_hailin_hl7621s.dts
          cp -f ${{ github.workspace }}/.config .config
          ls -la target/linux/ramips/image/
          ls -la target/linux/ramips/dts/
          ls -la .config

      - name: Update & Install Feeds
        run: |
          set -e
          cd ${{ env.SRC_DIR }}
          rm -rf feeds/*
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Defconfig & Size Check
        run: |
          set -e
          cd ${{ env.SRC_DIR }}
          echo "===== make defconfig ====="
          make defconfig
          echo "===== check-size test ====="
          make check-size V=s
          echo "✅ defconfig + check-size OK"

      - name: Start Compile
        id: compile
        run: |
          set +e
          cd ${{ env.SRC_DIR }}
          export INSTALL=/usr/bin/install
          make -j$(nproc) V=s IGNORE_ERRORS=1
          RET=$?
          echo "BUILD_EXIT_CODE=${RET}" >> $GITHUB_OUTPUT
          echo "build return code = ${RET}"
          exit ${RET}

      - name: Collect Firmware
        if: steps.compile.outputs.BUILD_EXIT_CODE == '0'
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/firmware
          cp -f ${{ env.SRC_DIR }}/bin/targets/ramips/mt7621/*.bin ${{ github.workspace }}/firmware/
          ls -la ${{ github.workspace }}/firmware/

      - name: Upload Firmware Artifact
        if: steps.compile.outputs.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: ${{ github.workspace }}/firmware
          retention-days: 30

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.SRC_DIR }}/build_log.*
          retention-days: 7
