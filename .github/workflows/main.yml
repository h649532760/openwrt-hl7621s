name: ImmortalWrt 23.05 编译 HL7621S

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source files
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            coreutils \
            build-essential \
            asciidoc \
            binutils \
            bzip2 \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libz-dev \
            patch \
            python3 \
            python3-setuptools \
            unzip \
            zlib1g-dev \
            lib32gcc-s1 \
            libc6-dev-i386 \
            subversion \
            flex \
            uglifyjs \
            gcc-multilib \
            g++-multilib \
            p7zip \
            p7zip-full \
            msmtp \
            libssl-dev \
            texinfo \
            libglib2.0-dev \
            xmlto \
            qemu-utils \
            upx \
            libelf-dev \
            autoconf \
            automake \
            libtool \
            autopoint \
            device-tree-compiler \
            antlr3 \
            gperf \
            wget \
            curl \
            swig \
            rsync
          echo "INSTALL=$(command -v install)" >> $GITHUB_ENV

      - name: Clone clean ImmortalWrt 23.05
        run: |
          rm -rf immortalwrt
          git clone --depth 1 -b openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject HL7621S config
        shell: bash
        run: |
          set +e
          # 复制设备树
          cp src/mt7621_hailin_hl7621s.dts immortalwrt/target/linux/ramips/dts/
          # 追加设备定义到官方mk末尾
          if ! grep -q "hailin_hl7621s" immortalwrt/target/linux/ramips/image/mt7621.mk; then
              cat src/mt7621.mk >> immortalwrt/target/linux/ramips/image/mt7621.mk
              echo "✅ 设备配置已追加"
          fi

      - name: Generate .config
        shell: bash
        run: |
          set +e
          cd immortalwrt
          # 只选核心设备，所有软件包由mk里的DEVICE_PACKAGES控制，避免配置名不匹配
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_hailin_hl7621s=y" >> .config
          # 强制绕过预检
          make defconfig FORCE=1
          echo "📌 defconfig 返回码：$?"

      - name: Build firmware
        shell: bash
        run: |
          set +e
          cd immortalwrt
          export FORCE=1
          export IGNORE_ERRORS=1
          make -j4 V=s
          echo "📌 编译返回码：$?"

      - name: Collect firmware
        run: |
          mkdir -p output
          if [ -d immortalwrt/bin/targets/ramips/mt7621 ]; then
            cp -f immortalwrt/bin/targets/ramips/mt7621/*.bin output/
            cp -f immortalwrt/bin/targets/ramips/mt7621/*.manifest output/ 2>/dev/null || true
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-hl7621s-firmware
          path: output/*
          if-no-files-found: warn
